name: 'Release Branch Check & Tagging'

on:
  push:
    branches:
      - release

jobs:
  check-and-tag:
    name: 'Lint, Test & Create Release Tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Install pnpm'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 'Use Node.js ${{ matrix.node-version }}'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: 'Install dependencies'
        run: pnpm install

      - name: 'Run Lint'
        run: pnpm run lint

      - name: 'Run Tests'
        run: pnpm test

      - name: 'Extract version from package.json'
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: 'Check if release already exists'
        id: check_release
        run: |
          STATUS=$(gh release view "v${{ steps.version.outputs.version }}" --json tagName --jq '.tagName' 2>&1) || true
          if [ "$STATUS" = "v${{ steps.version.outputs.version }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} already exists. Skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Create Git Tag and GitHub Release'
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
